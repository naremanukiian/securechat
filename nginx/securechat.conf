# /etc/nginx/sites-available/securechat

upstream securechat {
    server 127.0.0.1:5000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # Self-signed SSL cert (generated by setup.sh)
    ssl_certificate     /etc/ssl/securechat/cert.pem;
    ssl_certificate_key /etc/ssl/securechat/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1000;

    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /home/narem/securechat/app/static/;
        expires 7d;
        access_log off;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass         http://securechat;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400;
    }

    # Everything else → Flask
    location / {
        proxy_pass         http://securechat;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }
}
